scenario:
  id: eval_platform_sync_01
  title: platform template sync and data sync after successful run
inputs:
  workflow: workflow.yaml
  instrument_profile: instrument_profile.yaml
  platform_adapter: platform_adapter.yaml
  fixtures:
    - screenshots/success/
expected_events:
  - template_published:
      template_id: tpl_battery_cycle_standard
      template_version: 1.2.0
  - template_fetched:
      template_id: tpl_battery_cycle_standard
      template_version: 1.2.0
  - step_id: start_run
    result_status: success
  - upload_status: completed
  - upload_results_contains:
      - final_voltage
      - run_status
pass_criteria:
  - all_expected_events_present
  - no_unhandled_exception
  - run_trace_contains_artifacts
  - template_sync_trace_present
fixtures:
  mock_platform_server: fixtures/mock_speclabos
  baseline_trace: fixtures/baseline_run_trace.jsonl
