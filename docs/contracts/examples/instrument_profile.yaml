device_id: potentiostat_win_01
supported_os:
  - windows
window_signature:
  title_contains: "ElectroChem Console"
  min_width: 1200
  min_height: 800
anchors:
  - id: anchor_start_button
    type: button
    locator_hint: green button in footer
  - id: anchor_voltage_input
    type: input
    locator_hint: setpoint form field
  - id: roi_voltage_value
    type: roi
    locator_hint: value card near live chart
actions:
  - click
  - type
  - hotkey
  - wait_until
safety_limits:
  max_voltage: 5.0
  min_voltage: 0.0
  requires_manual_confirm_for:
    - start_run
