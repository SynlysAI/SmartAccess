profile_id: windows_calculator
window_signature:
  title_contains: Calculator
  process_name: CalculatorApp.exe
  screenshot_size:
    width: 420
    height: 640
anchors:
  - id: display_result
    action_region:
      pixel:
        x: 20
        y: 72
        width: 380
        height: 92
      normalized:
        x: 0.0476
        y: 0.1125
        width: 0.9048
        height: 0.1438
    observe_region:
      pixel:
        x: 20
        y: 72
        width: 380
        height: 92
      normalized:
        x: 0.0476
        y: 0.1125
        width: 0.9048
        height: 0.1438
    supported_actions:
      - click
    default_wait_seconds: 0.3
    action_bindings:
      - action: click
        requires_confirmation: false
    vision_mode: ocr
    notes: 标准模式结果显示区；用于 OCR 证明最终结果为 46。
  - id: keypad_focus
    action_region:
      pixel:
        x: 210
        y: 356
        width: 44
        height: 44
      normalized:
        x: 0.5
        y: 0.5563
        width: 0.1048
        height: 0.0688
    supported_actions:
      - click
      - type
      - hotkey
      - press_enter
    default_wait_seconds: 0.2
    action_bindings:
      - action: click
        requires_confirmation: false
      - action: type
        requires_confirmation: false
      - action: hotkey
        requires_confirmation: false
      - action: press_enter
        requires_confirmation: false
    notes: 计算器窗口聚焦锚点；表达式用 type 发送，等号用 press_enter 触发。
