metadata:
  workflow_id: wf_battery_cycle_v2
  anchor_profile: potentiostat_win_01
  author: smartaccess
  lifecycle_state: Published
  template_id: tpl_battery_cycle_standard
  template_version: 2.0.0
steps:
  - id: open_method_editor
    anchor_id: method_editor
    action: click
    match_mode: none
    wait_seconds: 1.0
  - id: input_target_voltage
    anchor_id: voltage_input
    action: type
    value: "4.20"
    match_mode: none
    wait_seconds: 0.5
  - id: start_run
    anchor_id: start_run
    action: click
    expected_text: Running
    match_mode: contains
    timeout_seconds: 10.0
    requires_confirmation: true
