[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "smartaccess"
version = "0.1.0"
description = "SmartAccess runtime, desktop shell, and shared contract models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
]

[project.optional-dependencies]
desktop = [
  "PyQt6>=6.6,<7",
]
serve = [
  "uvicorn[standard]>=0.29,<1",
]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
smartaccess-desktop = "smartaccess.bootstrap:run_desktop"
smartaccess-edge = "smartaccess.bootstrap:serve_edge_api"

[tool.hatch.build.targets.wheel]
packages = ["src/smartaccess"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
