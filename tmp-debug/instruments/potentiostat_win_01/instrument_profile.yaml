device_id: potentiostat_win_01
supported_os:
- windows
window_signature:
  title_contains: ElectroChem Console
  capture_width: 1280
  capture_height: 860
anchors:
- id: anchor_start_button
  type: button
  roi:
    x: 40.0
    y: 40.0
    width: 160.0
    height: 48.0
  normalized_roi:
    x: 0.1
    y: 0.08
    width: 0.2
    height: 0.08
  action_bindings:
  - action: click
    requires_confirmation: true
    metadata: {}
  vision_mode: none
  confidence_threshold: 0.8
- id: anchor_voltage_input
  type: input
  roi:
    x: 220.0
    y: 132.0
    width: 140.0
    height: 42.0
  normalized_roi:
    x: 0.28
    y: 0.22
    width: 0.18
    height: 0.07
  action_bindings:
  - action: type
    requires_confirmation: false
    default_value: '4.20'
    metadata: {}
  vision_mode: none
- id: roi_voltage_value
  type: observation
  roi:
    x: 320.0
    y: 182.0
    width: 180.0
    height: 56.0
  normalized_roi:
    x: 0.4
    y: 0.3
    width: 0.22
    height: 0.09
  action_bindings: []
  vision_mode: ocr
  confidence_threshold: 0.7
actions:
- click
- type
- hotkey
- wait_until
safety_limits:
  max_voltage: 5.0
  min_voltage: 0.0
  requires_manual_confirm_for:
  - start_run
  fields:
  - field_id: start_run
    label: 启动运行
    value_type: bool
    allowed_values: []
    requires_confirmation: true
    risk_level: high
    applies_to_steps:
    - start_run
